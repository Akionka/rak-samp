name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy, Tests, and Release Build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.0
          target: i686-pc-windows-msvc
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Check release build
        run: cargo build --workspace --release --locked

  protocol:
    name: Protocol Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.0
          target: x86_64-unknown-linux-gnu
          components: clippy

      - name: Run Protocol tests
        run: cargo test -p samp-protocol --target x86_64-unknown-linux-gnu --locked

      - name: Run Protocol Clippy
        run: cargo clippy -p samp-protocol --target x86_64-unknown-linux-gnu --all-targets --locked -- -D warnings
