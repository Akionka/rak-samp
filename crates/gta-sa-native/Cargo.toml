[package]
name = "gta-sa-native"
version = "0.1.0-alpha.4"
edition = "2024"
rust-version = "1.98"
description = "Host-only direct GTA San Andreas backend for the modkit host"
license = "MIT"
repository = "https://github.com/Akionka/samp-client-sdk"

[lib]
name = "gta_sa_native"

[dependencies]
gta-sa = { version = "=0.1.0-alpha.4", path = "../gta-sa" }
log = "0.4"
modkit-win32 = { version = "=0.1.0-alpha.4", path = "../modkit-win32" }
sha2 = "0.10"
windows-sys = { version = "0.61", features = [
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
