[package]
name = "samp"
version = "0.1.0-alpha.4"
edition = "2024"
rust-version = "1.98"
description = "Safe service-backed Rust facade for SA-MP client plugins"
license = "MIT"
repository = "https://github.com/Akionka/samp-client-sdk"

[lib]
name = "samp"

[dependencies]
gta-sa = { version = "=0.1.0-alpha.4", path = "../gta-sa" }
log = "0.4"
modkit-abi = { version = "=0.1.0-alpha.4", path = "../modkit-abi" }
modkit-sdk = { version = "=0.1.0-alpha.4", path = "../modkit-sdk" }
samp-protocol = { version = "=0.1.0-alpha.4", path = "../samp-protocol" }
