[package]
name = "samp-client-sdk-host"
version = "0.1.0-alpha.4"
edition = "2024"
rust-version = "1.98"
description = "Windows x86 SA-MP client bridge host for samp-client-sdk plugins"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Akionka/samp-client-sdk"
homepage = "https://github.com/Akionka/samp-client-sdk"
documentation = "https://docs.rs/samp-client-sdk-host"
keywords = ["samp", "raknet", "gta-sa", "asi", "windows"]
categories = ["api-bindings", "game-development", "os::windows-apis"]
include = [
    "/src",
    "/tests",
    "/build.rs",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
]

[package.metadata.docs.rs]
default-target = "i686-pc-windows-msvc"
targets = ["i686-pc-windows-msvc"]

[workspace]
members = [
    "crates/gta-sa",
    "crates/gta-sa-native",
    "crates/modkit-abi",
    "crates/modkit-runtime",
    "crates/modkit-sdk",
    "crates/modkit-win32",
    "crates/samp-protocol",
    "crates/samp-native",
    "crates/samp",
    "sdk",
    "examples/chat_command_plugin",
    "examples/gta_basic_plugin",
    "examples/dl_network_probe",
    "examples/modkit_connect_plugin",
    "examples/network_smoke_plugin",
    "examples/r1_network_probe",
    "examples/r3_network_probe",
    "examples/r5_network_probe",
    "examples/sample_plugin",
    "examples/samp_service_chat_plugin",
    "examples/samp_service_network_plugin",
]
default-members = ["."]
resolver = "3"

[lib]
name = "samp_client_sdk"
crate-type = ["cdylib"]

[dependencies]
log = "0.4"
modkit-abi = { path = "crates/modkit-abi" }
modkit-runtime = { path = "crates/modkit-runtime" }
sdk_abi = { package = "samp-client-sdk", version = "=0.1.0-alpha.4", path = "sdk" }
simplelog = "0.12"

[build-dependencies]
cc = "1.4"

[target.'cfg(all(windows, target_arch = "x86"))'.dependencies]
gta-sa = { path = "crates/gta-sa" }
gta-sa-native = { path = "crates/gta-sa-native" }
minhook = "0.9"
modkit-win32 = { path = "crates/modkit-win32" }
samp-native = { path = "crates/samp-native" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
