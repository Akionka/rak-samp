[config]
default_to_workspace = false
skip_core_tasks = true

[env]
GTA_DIR = { value = "", condition = { env_not_set = ["GTA_DIR"] } }

[tasks.format]
description = "Format all workspace crates"
command = "cargo"
args = ["fmt", "--all"]

[tasks.format-check]
description = "Check formatting without changing files"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.check]
description = "Check all workspace targets"
command = "cargo"
args = ["check", "--workspace", "--all-targets", "--locked"]

[tasks.test]
description = "Run all workspace tests"
command = "cargo"
args = ["test", "--workspace", "--all-targets", "--locked"]

[tasks.clippy]
description = "Lint all workspace targets and deny warnings"
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--locked", "--", "-D", "warnings"]

[tasks.doc]
description = "Build public workspace documentation without dependencies"
command = "cargo"
args = [
    "doc",
    "--workspace",
    "--exclude",
    "samp-client-sdk-host",
    "--no-deps",
    "--locked",
]

[tasks.release-hygiene]
description = "Audit published metadata, vocabulary, and generated public API"
dependencies = ["doc"]
command = "powershell"
args = [
    "-NoProfile",
    "-ExecutionPolicy",
    "Bypass",
    "-File",
    "scripts/check-release-hygiene.ps1",
]

[tasks.package-published]
description = "Package and verify published crates"
command = "powershell"
args = [
    "-NoProfile",
    "-ExecutionPolicy",
    "Bypass",
    "-File",
    "scripts/package-published-crates.ps1",
]

[tasks.quality]
description = "Run the complete local quality gate"
dependencies = [
    "format-check",
    "check",
    "test",
    "clippy",
    "release-hygiene",
    "package-published",
]

[tasks.build-release]
command = "cargo"
args = ["build", "--workspace", "--release", "--locked"]

[tasks.build-debug]
command = "cargo"
args = ["build", "--workspace", "--locked"]

[tasks.require-gta-dir]
private = true
script_runner = "@duckscript"
script = '''
gta_dir = get_env GTA_DIR
gta_dir = trim ${gta_dir}

if is_empty ${gta_dir}
    trigger_error "GTA_DIR is not set. Set it to your GTA installation directory."
end
'''

[tasks.install]
dependencies = ["require-gta-dir", "build-release"]
command = "powershell"
args = [
    "-NoProfile",
    "-Command",
    '''
    $ErrorActionPreference = "Stop"
    $profileDir = Join-Path $env:CARGO_MAKE_CRATE_CUSTOM_TRIPLE_TARGET_DIRECTORY 'release'
    Copy-Item -Force (Join-Path $profileDir 'samp_client_sdk.dll') (Join-Path $env:GTA_DIR 'samp_client_sdk.asi')
    ''',
]

[tasks.install-chat-command-example]
dependencies = ["require-gta-dir", "build-release"]
command = "powershell"
args = [
    "-NoProfile",
    "-Command",
    '''
    $ErrorActionPreference = "Stop"
    $profileDir = Join-Path $env:CARGO_MAKE_CRATE_CUSTOM_TRIPLE_TARGET_DIRECTORY 'release'
    Copy-Item -Force (Join-Path $profileDir 'samp_client_sdk.dll') (Join-Path $env:GTA_DIR 'samp_client_sdk.asi')
    Copy-Item -Force (Join-Path $profileDir 'samp_client_sdk_chat_command_example.dll') (Join-Path $env:GTA_DIR 'samp_client_sdk_chat_command_example.asi')
    ''',
]

[tasks.install-debug]
dependencies = ["require-gta-dir", "build-debug"]
command = "powershell"
args = [
    "-NoProfile",
    "-Command",
    '''
    $ErrorActionPreference = "Stop"
    $profileDir = Join-Path $env:CARGO_MAKE_CRATE_CUSTOM_TRIPLE_TARGET_DIRECTORY 'debug'
    $pdb = Join-Path $profileDir 'samp_client_sdk.pdb'
    Copy-Item -Force (Join-Path $profileDir 'samp_client_sdk.dll') (Join-Path $env:GTA_DIR 'samp_client_sdk.asi')
    if (Test-Path $pdb) { Copy-Item -Force $pdb (Join-Path $env:GTA_DIR 'samp_client_sdk.pdb') }
    ''',
]
