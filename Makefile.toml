[env]
GTA_DIR = { value = "", condition = { env_not_set = ["GTA_DIR"] } }

[tasks.build-asi]
workspace = false
command = "cargo"
args = ["build", "--release"]

[tasks.build-asi-debug]
workspace = false
command = "cargo"
args = ["build"]

[tasks.build-validation]
workspace = false
command = "cargo"
args = ["build", "--release", "-p", "rak_samp_validation_plugin"]

[tasks.build-validation-unloader]
workspace = false
command = "cargo"
args = ["build", "--release", "-p", "rak_samp_validation_unloader"]

[tasks.build-chat-command-example]
workspace = false
command = "cargo"
args = ["build", "--release", "-p", "rak_samp_chat_command_example"]

[tasks.require-gta-dir]
command = "powershell"
args = [
    "-Command",
    "if ([string]::IsNullOrWhiteSpace($env:GTA_DIR)) { throw 'GTA_DIR is not set. In PowerShell, run: $env:GTA_DIR = ''D:\\path\\to\\GTA''' }",
]

[tasks.deploy]
workspace = false
dependencies = ["require-gta-dir", "build-asi"]
script = [
    "powershell -Command \"Copy-Item -Force target/i686-pc-windows-msvc/release/rak_samp.dll (Join-Path $env:GTA_DIR 'rak_samp.asi')\"",
]

[tasks.deploy-validation]
workspace = false
dependencies = ["require-gta-dir", "build-asi", "build-validation"]
script = [
    "powershell -Command \"Copy-Item -Force target/i686-pc-windows-msvc/release/rak_samp.dll (Join-Path $env:GTA_DIR 'rak_samp.asi')\"",
    "powershell -Command \"Copy-Item -Force target/i686-pc-windows-msvc/release/rak_samp_validation_plugin.dll (Join-Path $env:GTA_DIR 'rak_samp_validation.asi')\"",
]

[tasks.deploy-validation-unload]
workspace = false
dependencies = [
    "require-gta-dir",
    "build-asi",
    "build-validation",
    "build-validation-unloader",
]
script = [
    "powershell -Command \"Copy-Item -Force target/i686-pc-windows-msvc/release/rak_samp.dll (Join-Path $env:GTA_DIR 'rak_samp.asi')\"",
    "powershell -Command \"Copy-Item -Force target/i686-pc-windows-msvc/release/rak_samp_validation_plugin.dll (Join-Path $env:GTA_DIR 'rak_samp_validation.asi')\"",
    "powershell -Command \"Copy-Item -Force target/i686-pc-windows-msvc/release/rak_samp_validation_unloader.dll (Join-Path $env:GTA_DIR 'rak_samp_validation_unloader.asi')\"",
]

[tasks.deploy-chat-command-example]
workspace = false
dependencies = ["require-gta-dir", "build-asi", "build-chat-command-example"]
script = [
    "powershell -Command \"Copy-Item -Force target/i686-pc-windows-msvc/release/rak_samp.dll (Join-Path $env:GTA_DIR 'rak_samp.asi')\"",
    "powershell -Command \"Copy-Item -Force target/i686-pc-windows-msvc/release/rak_samp_chat_command_example.dll (Join-Path $env:GTA_DIR 'rak_samp_chat_command_example.asi')\"",
]

[tasks.debug]
workspace = false
dependencies = ["require-gta-dir", "build-asi-debug"]
script = [
    "powershell -Command \"Copy-Item -Force target/i686-pc-windows-msvc/debug/rak_samp.dll (Join-Path $env:GTA_DIR 'rak_samp.asi'); Copy-Item -Force target/i686-pc-windows-msvc/debug/rak_samp.pdb (Join-Path $env:GTA_DIR 'rak_samp.pdb')\"",
]
