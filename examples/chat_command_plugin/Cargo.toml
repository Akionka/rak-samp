[package]
name = "samp-client-sdk-chat-command-example"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
modkit-abi = { path = "../../crates/modkit-abi" }
samp = { path = "../../crates/samp" }
samp-protocol = { path = "../../crates/samp-protocol" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
] }
